@if (showHeader) {
  <app-header />
}

<router-outlet />

<button (click)="theme.toggle()"
  class="fixed bottom-6 right-6 z-50 w-11 h-11 rounded-full flex items-center justify-center text-lg shadow-lg cursor-pointer transition"
  [class.bg-purple-dark]="theme.theme() === 'light'"
  [class.bg-white/10]="theme.theme() === 'dark'"
  [class.border]="true"
  [class.border-white/20]="theme.theme() === 'dark'"
  [class.border-purple-500/30]="theme.theme() === 'light'"
  [class.backdrop-blur-xl]="true"
  title="Alternar tema">
  @if (theme.theme() === 'dark') { ☀️ } @else { 🌙 }
</button>
